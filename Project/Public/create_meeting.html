<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Riunione - E-vote CEO</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Sources/css/dashboard.css">
    <link rel="stylesheet" href="Sources/css/create_meeting.css">
    <script defer src="Sources/js/create_meeting.js"></script>
</head>

<body>

    <aside>
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
            UniTorV E-Vote
        </div>

        <div class="history-title">Menu</div>
        <ul class="history-list">
            <li class="history-item" onclick="window.location.href='ceo_dashboard.html'">Torna alla Dashboard</li>
            <li class="history-item" onclick="window.location.href='settings.html'">Impostazioni</li>
        </ul>
    </aside>

    <main>
        <header>
            <a href="javascript:history.go(-1)" class="btn-back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Indietro
            </a>
            <div class="user-profile">
                <span id="userNameHeader">Caricamento...</span>
                <div class="avatar" id="userInitials">--</div>
            </div>
        </header>

        <h1>Crea Nuova <span>Riunione</span></h1>
        <p style="margin-bottom: 30px; color: var(--gray-text);">Configura i parametri dell'assemblea e carica il
            documento ufficiale.</p>

        <div class="form-card">
            <form id="meetingForm">

                <div class="form-section">
                    <h3>Dettagli Assemblea</h3>
                    <div class="form-group">
                        <label for="titolo">Titolo Assemblea</label>
                        <input type="text" id="titolo" placeholder="Es: Approvazione Bilancio 2025" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dataInizio">Data e Ora Inizio</label>
                            <input type="datetime-local" id="dataInizio" required>
                        </div>
                        <div class="form-group">
                            <label for="dataFine">Data e Ora Fine</label>
                            <input type="datetime-local" id="dataFine" required>
                        </div>

                        <div class="form-group">
                            <label for="numeroVotazioni">Numero di Votazioni Previste</label>
                            <input type="number" id="numeroVotazioni" placeholder="Es: 3" min="1" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Partecipanti & Documentazione</h3>
                    <div class="form-group">
                        <label for="partecipanti">ID Wallet Partecipanti (separati da virgola)</label>
                        <textarea id="partecipanti" rows="3" placeholder="Es: 0x123..., 0x456..., 0x789..."
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="verbaleFile">Carica Verbale Certificato (PDF)</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="verbaleFile" accept="application/pdf" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="deployBtn">
                    Avvia Sessione su Blockchain
                </button>

                <div class="status-message" id="status"></div>
            </form>
        </div>
    </main>

    <script>
        // Piccolo script per personalizzare l'header al caricamento
        document.addEventListener("DOMContentLoaded", () => {
            const user = JSON.parse(localStorage.getItem("user"));
            if (user) {
                document.getElementById("userNameHeader").innerText = user.nome + " " + user.cognome;
            }
        });
    </script>
</body>

</html>
