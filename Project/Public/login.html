<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-vote System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <script defer src="login.js"></script>

</head>

<body>

    <div class="login-card">
        <div class="logo-area">
            <svg class="logo-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <h2>Tor Vergata Voting</h2>
            <p class="subtitle">Accesso Sicuro su Blockchain</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="walletId">ID Utente (Wallet Address)</label>
                <input type="text" id="walletId" placeholder="Es: 0xAdmin... o 0xMember..." required>
            </div>

            <div class="form-group">
                <label for="password">Password (Chiave Privata)</label>
                <input type="password" id="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">
                <span id="btnText">Accedi</span>
            </button>
        </form>

        <div id="login-message"></div>

        <div class="blockchain-status">
            <div class="status-dot"></div>
            <span>Nodo Attivo: Tor Vergata Mainnet</span>
        </div>
    </div>
</body>

</html>
