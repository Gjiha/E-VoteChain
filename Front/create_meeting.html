<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Riunione - E-vote CEO</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --tv-green: #006747; --white: #ffffff; --black: #1a1a1a; --gray-light: #f4f6f8; --gray-text: #666666; --shadow: 0 4px 6px rgba(0,0,0,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--gray-light); color: var(--black); display: flex; height: 100vh; }
        
        main { flex: 1; padding: 40px; max-width: 800px; margin: 0 auto; overflow-y: auto; }
        .header-nav { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .back-btn { text-decoration: none; color: var(--tv-green); font-weight: 500; }
        
        .form-card { background: var(--white); padding: 40px; border-radius: 12px; box-shadow: var(--shadow); }
        .form-card h1 { margin-bottom: 25px; font-weight: 300; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        input[type="text"], input[type="datetime-local"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--tv-green); }
        
        .file-drop { border: 2px dashed #ccc; padding: 30px; text-align: center; border-radius: 6px; background: #fafafa; cursor: pointer; margin-bottom: 20px;}
        .file-drop:hover { border-color: var(--tv-green); }
        
        .btn-submit { background: var(--tv-green); color: white; padding: 15px 30px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-submit:hover { background: #004d35; }
    </style>
</head>
<body>
    <main>
        <div class="header-nav">
            <a href="ceo_dashboard.html" class="back-btn">← Torna alla Dashboard</a>
        </div>

        <div class="form-card">
            <h1>Configura Nuova Riunione</h1>
            
            <form onsubmit="deployContract(event)">
                <div class="form-group">
                    <label>Oggetto della Votazione / Titolo Assemblea</label>
                    <input type="text" placeholder="Es. Nomina nuovo Consiglio Direttivo" required>
                </div>
                
                <div class="form-group" style="display: flex; gap: 20px;">
                    <div style="flex: 1;">
                        <label>Data e Ora Inizio</label>
                        <input type="datetime-local" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Data e Ora Fine</label>
                        <input type="datetime-local" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Quorum Minimo (%)</label>
                    <select required>
                        <option value="50">Maggioranza Assoluta (50% + 1)</option>
                        <option value="66">Maggioranza Qualificata (2/3)</option>
                        <option value="100">Unanimità (100%)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Carica Documenti (verranno salvati su IPFS)</label>
                    <div class="file-drop" onclick="alert('Apertura finestra caricamento file...')">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p style="margin-top: 10px; color: var(--gray-text); font-size: 14px;">Trascina i file qui o clicca per sfogliare</p>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="deployBtn">Genera Smart Contract e Pubblica</button>
            </form>
        </div>
    </main>

    <script>
        function deployContract(e) {
            e.preventDefault();
            const btn = document.getElementById('deployBtn');
            btn.innerText = "Deploy su Blockchain in corso...";
            btn.style.background = "#555";
            setTimeout(() => {
                alert("Smart Contract generato con successo! I soci riceveranno la notifica.");
                window.location.href = 'ceo_dashboard.html';
            }, 2000);
        }
    </script>
</body>
</html>
