<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-vote System</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- STILI LOGIN (Identici alla versione precedente) --- */
        :root {
            --tv-green: #006747;
            --tv-green-dark: #00422d;
            --tv-green-bg: #003323; 
            --white: #ffffff;
            --black: #1a1a1a;
            --gray-text: #666666;
            --error-red: #d32f2f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }

        body {
            background-color: var(--tv-green-bg);
            background-image: radial-gradient(#004d35 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--black);
        }

        .login-card {
            background-color: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::top { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background-color: var(--tv-green); }

        .logo-area { margin-bottom: 30px; color: var(--tv-green); }
        .logo-icon { margin-bottom: 10px; color: var(--tv-green); }

        h2 { font-size: 24px; font-weight: 700; margin-bottom: 5px; color: var(--black); }
        .subtitle { font-size: 14px; color: var(--gray-text); margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--black); }
        
        input {
            width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0;
            border-radius: 6px; font-size: 16px; transition: border-color 0.3s; outline: none;
        }
        input:focus { border-color: var(--tv-green); }

        .btn-login {
            width: 100%; padding: 14px; background-color: var(--tv-green); color: var(--white);
            border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer;
            transition: background 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-login:hover { background-color: var(--tv-green-dark); }
        .btn-login:disabled { background-color: #a0a0a0; cursor: not-allowed; }

        .blockchain-status {
            margin-top: 25px; padding-top: 20px; border-top: 1px solid #f0f0f0;
            font-size: 12px; color: var(--gray-text); display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .status-dot { width: 8px; height: 8px; background-color: #28a745; border-radius: 50%; box-shadow: 0 0 5px #28a745; }

        #login-message { margin-top: 10px; font-size: 12px; font-family: 'Courier New', monospace; color: var(--tv-green); height: 15px; }
        .error-msg { color: var(--error-red) !important; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <svg class="logo-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <h2>Tor Vergata Voting</h2>
            <p class="subtitle">Accesso Sicuro su Blockchain</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="walletId">ID Utente (Wallet Address)</label>
                <input type="text" id="walletId" placeholder="Es: 0xAdmin... o 0xMember..." required>
            </div>

            <div class="form-group">
                <label for="password">Password (Chiave Privata)</label>
                <input type="password" id="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">
                <span id="btnText">Accedi</span>
            </button>
        </form>
        
        <div id="login-message"></div>

        <div class="blockchain-status">
            <div class="status-dot"></div>
            <span>Nodo Attivo: Tor Vergata Mainnet</span>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault(); 

            const walletInput = document.getElementById('walletId').value.toLowerCase();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const msg = document.getElementById('login-message');

            // Reset UI
            msg.classList.remove('error-msg');
            btn.disabled = true;
            btnText.innerText = 'Verifica Blockchain in corso...';
            
            // Simulazione Log
            msg.innerText = "> Hashing SHA-256...";
            
            setTimeout(() => { msg.innerText = "> Verifica Smart Contract..."; }, 1000);

            setTimeout(() => {
                // LOGICA DI REINDIRIZZAMENTO
                if (walletInput.includes("admin")) {
                    msg.innerText = "> Ruolo identificato: CEO/ADMIN";
                    window.location.href = 'ceo_dashboard.html'; // Assicurati di salvare la pagina CEO con questo nome
                } 
                else if (walletInput.includes("member") || walletInput.includes("socio")) {
                    msg.innerText = "> Ruolo identificato: SOCIO/MEMBRO";
                    window.location.href = 'member_dashboard.html'; // Link alla nuova pagina membro
                } 
                else {
                    msg.innerText = "> Errore: Credenziali non riconosciute nel Ledger.";
                    msg.classList.add('error-msg');
                    btn.disabled = false;
                    btnText.innerText = 'Accedi';
                }
            }, 2500);
        }
    </script>
</body>
</html>
